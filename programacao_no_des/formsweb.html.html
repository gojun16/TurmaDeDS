<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Clientes</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      max-width: 400px;
    }
    input, select, button { 
      margin: 5px 0; 
      display: block; 
      width: 100%; 
      box-sizing: border-box;
      padding: 8px;
    }
    #listBoxClientes { 
      height: 120px; 
    }
    .btn-group {
      display: flex;
      gap: 5px;
    }
    .btn-group button {
      flex: 1;
    }
  </style>
</head>
<body>
  <h2>Cadastro de Clientes</h2>

  <label for="listBoxClientes">Clientes:</label>
  <select id="listBoxClientes" size="5"></select>
  <button onclick="buscarCliente()">Buscar Cliente</button>

  <h3>Dados do Cliente</h3>
  <input type="text" id="txtNome" placeholder="Nome">
  <input type="text" id="txtEndereco" placeholder="Endereço">
  <input type="text" id="txtTelefone" placeholder="Telefone">
  <input type="email" id="txtEmail" placeholder="Email">

  <div class="btn-group">
    <button onclick="incluirCliente()">Incluir Cliente</button>
    <button onclick="alterarCliente()">Alterar Cliente</button>
  </div>
  <button onclick="limparCampos()">Limpar Campos</button>

  <script>
    // Inicializa os dados padrão caso o localStorage esteja vazio
    if (!localStorage.getItem("clientes")) {
      const clientesIniciais = [
        { id: 1, nome: "João Silva", endereco: "Rua A", telefone: "123456", email: "joao@gmail.com" },
        { id: 2, nome: "Maria Oliveira", endereco: "Rua B", telefone: "654321", email: "maria@gmail.com" }
      ];
      localStorage.setItem("clientes", JSON.stringify(clientesIniciais));
    }

    // Carrega e preenche a Select (ListBox) com os clientes cadastrados
    function atualizarListaClientes() {
      const listBox = document.getElementById("listBoxClientes");
      listBox.innerHTML = ""; // Limpa a lista antes de reconstruir
      
      const listaClientes = JSON.parse(localStorage.getItem("clientes")) || [];
      
      listaClientes.forEach(cliente => {
        const option = document.createElement("option");
        option.value = cliente.id;
        option.textContent = `${cliente.id} - ${cliente.nome}`;
        listBox.appendChild(option);
      });
    }

    // Busca o cliente selecionado e preenche os campos do formulário
    function buscarCliente() {
      const listBox = document.getElementById("listBoxClientes");
      const selectedId = parseInt(listBox.value);
      
      if (!selectedId) {
        alert("Por favor, selecione um cliente na lista.");
        return;
      }

      const listaClientes = JSON.parse(localStorage.getItem("clientes")) || [];
      const cliente = listaClientes.find(c => c.id === selectedId);

      if (cliente) {
        document.getElementById("txtNome").value = cliente.nome;
        document.getElementById("txtEndereco").value = cliente.endereco;
        document.getElementById("txtTelefone").value = cliente.telefone;
        document.getElementById("txtEmail").value = cliente.email;
      }
    }

    // Função de validação dos campos obrigatórios
    function validarCampos(nome, endereco, telefone, email) {
      if (!nome || !endereco || !telefone || !email) {
        alert("Todos os campos devem estar preenchidos!");
        return false;
      }
      return true;
    }

    // Inclui um novo cliente na lista com ID único
    function incluirCliente() {
      const nome = document.getElementById("txtNome").value.trim();
      const endereco = document.getElementById("txtEndereco").value.trim();
      const telefone = document.getElementById("txtTelefone").value.trim();
      const email = document.getElementById("txtEmail").value.trim();

      if (!validarCampos(nome, endereco, telefone, email)) return;

      const listaClientes = JSON.parse(localStorage.getItem("clientes")) || [];
      
      // Gera um novo ID único (pega o maior ID existente + 1)
      const novoId = listaClientes.length > 0 
        ? Math.max(...listaClientes.map(c => c.id)) + 1 
        : 1;

      const novoCliente = { id: novoId, nome, endereco, telefone, email };
      listaClientes.push(novoCliente);

      localStorage.setItem("clientes", JSON.stringify(listaClientes));
      
      alert("Cliente incluído com sucesso!");
      limparCampos();
      atualizarListaClientes();
    }

    // Altera os dados do cliente selecionado no Select
    function alterarCliente() {
      const listBox = document.getElementById("listBoxClientes");
      const selectedId = parseInt(listBox.value);

      if (!selectedId) {
        alert("Por favor, selecione um cliente na lista para alterar.");
        return;
      }

      const nome = document.getElementById("txtNome").value.trim();
      const endereco = document.getElementById("txtEndereco").value.trim();
      const telefone = document.getElementById("txtTelefone").value.trim();
      const email = document.getElementById("txtEmail").value.trim();

      if (!validarCampos(nome, endereco, telefone, email)) return;

      const listaClientes = JSON.parse(localStorage.getItem("clientes")) || [];
      const index = listaClientes.findIndex(c => c.id === selectedId);

      if (index !== -1) {
        listaClientes[index] = { id: selectedId, nome, endereco, telefone, email };
        localStorage.setItem("clientes", JSON.stringify(listaClientes));
        
        alert("Dados do cliente alterados com sucesso!");
        limparCampos();
        atualizarListaClientes();
      }
    }

    // Limpa os campos do formulário
    function limparCampos() {
      document.getElementById("txtNome").value = "";
      document.getElementById("txtEndereco").value = "";
      document.getElementById("txtTelefone").value = "";
      document.getElementById("txtEmail").value = "";
      document.getElementById("listBoxClientes").selectedIndex = -1;
    }

    // Inicializa a lista ao carregar a página
    atualizarListaClientes();
  </script>
</body>
</html>
